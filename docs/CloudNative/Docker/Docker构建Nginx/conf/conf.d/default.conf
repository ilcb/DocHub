# ============================================================
# Nginx 子配置示例（conf.d/ 目录下，随项目走）
# 按需添加 server / upstream 配置；conf.d 已挂载到 /etc/nginx/conf.d
# ============================================================

# 容器内 127.0.0.1 指向 Nginx 容器自身，不要写 127.0.0.1：
# - 代理宿主机应用：host.docker.internal（Linux 已在 compose 中通过 extra_hosts 指向宿主网关）
# - 代理同一 compose 内其它容器：直接写服务名，如 http://app:8080
upstream backend {
    server host.docker.internal:18018;
    #server host.docker.internal:18019;
}

server {
    listen       80;
    server_name  localhost;

    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
