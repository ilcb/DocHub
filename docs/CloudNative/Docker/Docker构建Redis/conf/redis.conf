# ============================================================
# Redis 配置文件（精简版）
#
# 端口与密码通过 docker-compose 的启动命令传入（--port / --requirepass），
# 见 ./docker-compose.yml 与 ./.env。本文件只保留通用运行参数。
# ============================================================

# 监听所有网卡（容器内），由 compose 端口映射对外暴露
bind 0.0.0.0
protected-mode no

# 关闭后台守护（容器前台运行）
daemonize no

loglevel notice
logfile ""

databases 16

# ---------- 持久化：开启 AOF ----------
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB 快照
save 3600 1 300 100 60 10000
dbfilename dump.rdb
dir /data

# ---------- 内存上限，防止占满宿主机 ----------
maxmemory 512mb
maxmemory-policy noeviction
