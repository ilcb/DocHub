# ============================================================
# GitLab —— docker-compose 部署版本（独立按需启动）
#
# 常用命令（在本目录 Docker构建GitLab/ 下执行）：
#   docker compose up -d
#   docker compose ps
#   docker compose logs -f gitlab
#   docker compose down          # 停止并移除容器（命名卷数据保留）
#   docker compose down -v       # 连数据卷一起清空
#
# 说明：
#   - Web 访问地址由 .env 中 GITLAB_EXTERNAL_URL 决定（http/https 均可）。
#   - 初始 root 密码在容器 /etc/gitlab/initial_root_password，生成后 24 小时内有效。
#   - 迁移自 Linux 包安装（Omnibus）时，GITLAB_IMAGE 版本必须与源服务器一致，
#     先完成备份恢复，再考虑升级。
# ============================================================

services:
  gitlab:
    image: ${GITLAB_IMAGE}
    container_name: ${GITLAB_CONTAINER_NAME}
    restart: always
    hostname: ${GITLAB_HOSTNAME}
    environment:
      TZ: ${TZ}
      GITLAB_OMNIBUS_CONFIG: |
        external_url '${GITLAB_EXTERNAL_URL}'
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT}
        puma['worker_processes'] = ${GITLAB_PUMA_WORKERS}
        sidekiq['concurrency'] = ${GITLAB_SIDEKIQ_CONCURRENCY}
        prometheus_monitoring['enable'] = ${GITLAB_PROMETHEUS_ENABLE}
    ports:
      - "${GITLAB_HTTP_PORT}:80"
      - "${GITLAB_HTTPS_PORT}:443"
      - "${GITLAB_SSH_PORT}:22"
    volumes:
      - ${GITLAB_CONFIG_DIR:-gitlab-config}:/etc/gitlab
      - ${GITLAB_LOGS_DIR:-gitlab-logs}:/var/log/gitlab
      - ${GITLAB_DATA_DIR:-gitlab-data}:/var/opt/gitlab
    shm_size: '256m'
    # 增加资源限制，防止GitLab耗尽宿主机资源
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

volumes:
  gitlab-config:
  gitlab-logs:
  gitlab-data:
