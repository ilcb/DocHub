# my global config
global:
  # 设置抓取数据的时间间隔，间隔设置为每 15 秒一次，默认为每 1 分钟
  scrape_interval: 15s
  # 设定抓取数据的超时时间，默认为 10s
  scrape_timeout: 15s
  # 设置规则刷新，每 15 秒刷新一次规则，默认值为每 1 分钟
  evaluation_interval: 60s

# 监控报警配置（需要额外安装 alertmanager 组件）
alerting:
  alertmanagers:
  - static_configs:
    # 设定 alertmanager 和 prometheus 交互的接口（compose 内使用服务名）
    - targets: ["alertmanager:9093"]

# 报警规则文件
rule_files:
  - '/prometheus/rules/*.yml'

# 普罗米修斯与抓取模块交互的接口配置
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
    - targets: ["prometheus:9090"]
      labels:
        instance: prometheus

  - job_name: 'node-exporter'
    static_configs:
    - targets: ["node-exporter:9100"]

  - job_name: 'alertmanager'
    static_configs:
    - targets: ["alertmanager:9093"]
