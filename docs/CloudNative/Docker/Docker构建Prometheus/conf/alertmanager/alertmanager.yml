global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.qq.com:465'
  smtp_from: 'xx@qq.com'
  smtp_auth_username: 'xx@qq.com'
  # qq 邮箱授权码
  smtp_auth_password: 'xxxx'
  smtp_require_tls: false
  smtp_hello: 'qq.com'

templates:
  # 指定预警内容模板
  - '/alertmanager/template/*.tmpl'

route:
  group_by: ['alertname']
  group_wait: 5s
  group_interval: 5s
  repeat_interval: 5m
  receiver: 'email'

receivers:
  - name: 'email'
    email_configs:
    - to: 'xx@126.com'
      html: '{{ template "email.html" . }}'
      headers: { Subject: "[WARN]告警" }
      send_resolved: true
